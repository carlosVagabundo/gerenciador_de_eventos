<text x="429" y="147" font-size="12" font-weight="700" fill="#b3303d">FK</text>
<text x="463" y="147" font-size="14" font-weight="600" fill="#1b2140">user_id</text>
<text x="701" y="147" font-size="13" text-anchor="end" fill="#5d6583">→ users.id</text>
<text x="429" y="175" font-size="12" font-weight="700" fill="#b3303d">FK</text>
<text x="463" y="175" font-size="14" font-weight="600" fill="#1b2140">event_id</text>
<text x="701" y="175" font-size="13" text-anchor="end" fill="#5d6583">→ events.id</text>
