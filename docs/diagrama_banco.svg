<text x="701" y="259" font-size="13" text-anchor="end" fill="#5d6583">sem duplicar</text>
<rect x="415" y="400" width="300" height="187" rx="12" fill="#ffffff" stroke="#8a5a00" stroke-width="2.5"/>
