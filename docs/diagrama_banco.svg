<text x="463" y="203" font-size="14" font-weight="600" fill="#1b2140">registered_at</text>
<text x="701" y="203" font-size="13" text-anchor="end" fill="#5d6583">TEXT</text>
<text x="463" y="231" font-size="14" font-weight="600" fill="#1b2140">attended</text>
<text x="701" y="231" font-size="13" text-anchor="end" fill="#5d6583">0 | 1</text>
<rect x="417" y="240" width="296" height="28" fill="#f4f5fb"/>
<text x="429" y="259" font-size="12" font-weight="700" fill="#8a5a00">UQ</text>
