<text x="701" y="543" font-size="13" text-anchor="end" fill="#5d6583">TEXT</text>
<text x="429" y="571" font-size="12" font-weight="700" fill="#8a5a00">UQ</text>
<text x="463" y="571" font-size="14" font-weight="600" fill="#1b2140">(user_id, event_id)</text>
<text x="701" y="571" font-size="13" text-anchor="end" fill="#5d6583">sem duplicar</text>
<rect x="790" y="545" width="300" height="131" rx="12" fill="#ffffff" stroke="#5d6583" stroke-width="2.5"/>
<path d="M790,557 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#5d6583"/>
<text x="806" y="571" font-size="18" font-weight="700" fill="#ffffff">rate_limits</text>
<text x="804" y="604" font-size="12" font-weight="700" fill="#4f46e5">PK</text>
<text x="838" y="604" font-size="14" font-weight="600" fill="#1b2140">id</text>
<text x="1076" y="604" font-size="13" text-anchor="end" fill="#5d6583">INTEGER</text>
<rect x="792" y="613" width="296" height="28" fill="#f4f5fb"/>
<text x="838" y="632" font-size="14" font-weight="600" fill="#1b2140">key</text>
<text x="1076" y="632" font-size="13" text-anchor="end" fill="#5d6583">login:… ou reset:…</text>
<text x="838" y="660" font-size="14" font-weight="600" fill="#1b2140">created_at</text>
<text x="1076" y="660" font-size="13" text-anchor="end" fill="#5d6583">TEXT</text>
<text x="40" y="640" font-size="13.5" fill="#1b2140">1 → N  Um usuário tem várias inscrições; um evento tem várias inscrições (o mesmo vale para a lista de espera).</text>
<text x="40" y="664" font-size="13.5" fill="#1b2140">ON DELETE CASCADE: ao excluir um usuário ou um evento, as inscrições e a fila ligadas a ele somem junto.</text>
<text x="40" y="688" font-size="13.5" fill="#1b2140">UNIQUE(user_id, event_id): o banco impede inscrição duplicada, mesmo se o código falhar.</text>
<text x="40" y="712" font-size="13.5" fill="#1b2140">rate_limits é uma tabela técnica (sem relações): registra tentativas de login e pedidos de recuperação de senha.</text>
<text x="40" y="736" font-size="13.5" fill="#1b2140">PK = chave primária · FK = chave estrangeira · UQ = valor único</text>
</svg>