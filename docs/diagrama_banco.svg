<text x="463" y="459" font-size="14" font-weight="600" fill="#1b2140">id</text>
<text x="701" y="459" font-size="13" text-anchor="end" fill="#5d6583">INTEGER</text>
<rect x="417" y="468" width="296" height="28" fill="#f4f5fb"/>
