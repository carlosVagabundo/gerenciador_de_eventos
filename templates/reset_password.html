{% extends "base.html" %}{% block title %}Nova senha · EventManager{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="reset-title">
  <h1 class="brand large" id="reset-title"><span class="brand-mark" aria-hidden="true">E</span> Criar nova senha</h1>
  <p class="muted">Escolha uma senha nova para a sua conta.</p>
  <form method="post" class="form">{{ csrf_field() }}
    <div class="form-row">
      <label>Nova senha<input type="password" name="new_password" minlength="6" required autofocus autocomplete="new-password"></label>
      <label>Confirmar senha<input type="password" name="confirm_password" minlength="6" required autocomplete="new-password"></label>
    </div>
    <button class="btn primary full">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
