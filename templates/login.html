{% extends "base.html" %}{% block title %}Entrar · EventManager{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="login-title">
  <h1 class="brand large" id="login-title"><span class="brand-mark" aria-hidden="true">E</span> EventManager</h1>
  <p class="muted">Entre para acompanhar os eventos da escola.</p>
  <form method="post" class="form">{{ csrf_field() }}
    <label>E-mail<input type="email" name="email" placeholder="seu@email.com" required autofocus autocomplete="username"></label>
    <label>Senha<input type="password" name="password" placeholder="Sua senha" required autocomplete="current-password"></label>
    <button class="btn primary full">Entrar</button>
  </form>
  <p class="auth-bottom"><a href="{{ url_for('auth.forgot_password') }}">Esqueci minha senha</a></p>
  <p class="auth-bottom">Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Criar conta</a></p>
  <p class="auth-bottom"><a href="{{ url_for('main.index') }}">Voltar à página inicial</a></p>
</section>
{% endblock %}
